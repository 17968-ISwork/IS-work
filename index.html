<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dehydration Project - Ice Sensor</title>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;500;700&display=swap" rel="stylesheet">
    <style>
        :root { --bg-gradient: linear-gradient(180deg, #c7dbe8 0%, #f2f2f2 60%, #f2f2f2 100%); --btn-color: #4a90e2; }
        body { font-family: 'Sarabun', sans-serif; margin: 0; padding: 20px; background: var(--bg-gradient); min-height: 100vh; display: flex; justify-content: center; align-items: flex-start; }
        .card { background: white; padding: 30px; border-radius: 25px; width: 100%; max-width: 450px; display: none; box-shadow: 0 15px 35px rgba(0,0,0,0.1); }
        .active { display: block !important; }
        .header-ui { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .logout-btn { color: #ff4d4d; cursor: pointer; font-size: 14px; font-weight: bold; }
        h2 { text-align: center; color: #444; margin-bottom: 20px; }
        input, select { width: 100%; padding: 14px; margin: 10px 0; border: 1px solid #eee; border-radius: 12px; background: #f9f9f9; box-sizing: border-box; font-size: 16px; }
        .primary-btn { width: 100%; background: var(--btn-color); color: white; border: none; padding: 16px; border-radius: 30px; font-size: 18px; font-weight: bold; cursor: pointer; margin-top: 15px; }
        .stat-box { background: #f0f7ff; padding: 25px; border-radius: 20px; text-align: center; margin: 20px 0; border: 2px solid var(--btn-color); transition: 0.5s; }
        .val-display { font-size: 48px; font-weight: bold; color: var(--btn-color); margin: 10px 0; }
        .footer-btns { display: flex; gap: 15px; margin-top: 25px; }
        .btn-sub { flex: 1; padding: 12px; border: 2px solid var(--btn-color); background: white; color: var(--btn-color); border-radius: 15px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

    <div id="page-reg" class="card active">
        <h2>ลงทะเบียนผู้ใช้</h2>
        <input type="text" id="rName" placeholder="ชื่อ-นามสกุล">
        <select id="rGender">
            <option value="">เลือกเพศ</option>
            <option value="ชาย">ชาย</option>
            <option value="หญิง">หญิง</option>
        </select>
        <input type="number" id="rAge" placeholder="อายุ">
        <input type="number" id="rWeight" placeholder="น้ำหนัก (กก.)">
        <input type="number" id="rHeight" placeholder="ส่วนสูง (ซม.)">
        <button class="primary-btn" onclick="doRegister()">บันทึกข้อมูล</button>
    </div>

    <div id="page-dash" class="card">
        <div class="header-ui">
            <b id="userLabel"></b>
            <span class="logout-btn" onclick="location.reload()">ออกจากระบบ</span>
        </div>

        <button id="connectBtn" class="primary-btn" style="background:#28a745;" onclick="connectBLE()">🔵 เชื่อมต่อบลูทูธ</button>

        <div id="displayBox" class="stat-box">
            <h3 id="statusTxt">รอการเชื่อมต่อ...</h3>
            <div class="val-display"><span id="valShow">0.00</span> <small style="font-size:18px">ml</small></div>
            <p id="adviceTxt">กรุณากดปุ่มเชื่อมต่อเพื่อเริ่มวัดค่า</p>
        </div>

        <div class="footer-btns">
            <button class="btn-sub" onclick="showHistory()">📜 ประวัติ</button>
            <button class="btn-sub" onclick="showStats()">📊 สถิติ (CCTV)</button>
        </div>
    </div>

    <script>
        let user = {};
        let logs = [];
        let isConnected = false;

        function doRegister() {
            user = {
                name: document.getElementById('rName').value,
                gender: document.getElementById('rGender').value,
                weight: document.getElementById('rWeight').value
            };
            if(!user.name || !user.gender) return alert("กรุณากรอกข้อมูลให้ครบ");
            document.getElementById('userLabel').innerText = "คุณ " + user.name;
            document.getElementById('page-reg').classList.remove('active');
            document.getElementById('page-dash').classList.add('active');
        }

        // --- ฟังก์ชันเชื่อมต่อบลูทูธ (แบบรวมร่างทดสอบ) ---
        async function connectBLE() {
            // ส่วนนี้คือการจำลอง (Mockup) เพื่อให้ไอซ์เห็นภาพ
            alert("ระบบจำลอง: เชื่อมต่อกับเครื่องวัดเหงื่อสำเร็จ!");
            isConnected = true;
            document.getElementById('connectBtn').innerText = "✅ เชื่อมต่อแล้ว";
            document.getElementById('connectBtn').style.background = "#ccc";
            document.getElementById('statusTxt').innerText = "กำลังรับค่าจากเซนเซอร์...";

            // เริ่มรันตัวเลขสุ่มทุก 3 วินาที (เหมือนรับค่าจากบลูทูธจริง)
            setInterval(() => {
                if(isConnected) {
                    // สุ่มค่าเหงื่อระหว่าง 100 - 900
                    let mockVal = (Math.random() * 800 + 100).toFixed(2);
                    autoAnalyze(mockVal);
                }
            }, 3000);
        }

        // ฟังก์ชันวิเคราะห์อัตโนมัติ (หัวใจของไอซ์)
        function autoAnalyze(val) {
            let st = "ปกติ ✅", ad = "รักษาสมดุลน้ำแบบนี้ต่อไปนะ", color = "#f0f7ff";
            
            // ใช้เกณฑ์ตามเพศที่ไอซ์ต้องการ
            let limit = (user.gender === 'ชาย') ? 600 : 500;

            if(val > limit * 1.3) {
                st = "ขาดน้ำ 🚨"; 
                ad = "อันตราย! ควรดื่มน้ำเพิ่มประมาณ " + (user.weight * 5) + " มล."; 
                color = "#f8d7da";
            } else if (val > limit) {
                st = "เสี่ยงขาดน้ำ ⚠️"; 
                ad = "เริ่มเสียเหงื่อเยอะแล้ว จิบน้ำบ่อยๆ นะ"; 
                color = "#fff3cd";
            }

            // อัปเดตหน้าจอทันทีที่ค่าเปลี่ยน
            document.getElementById('statusTxt').innerText = st;
            document.getElementById('valShow').innerText = val;
            document.getElementById('adviceTxt').innerText = ad;
            document.getElementById('displayBox').style.background = color;

            // บันทึกประวัติ
            logs.push({ time: new Date().toLocaleTimeString(), status: st, val: val });
        }

        function showHistory() {
            let historyText = logs.slice(-5).map(l => `${l.time} : ${l.status} (${l.val})`).join('\n');
            alert("ประวัติล่าสุด:\n" + (historyText || "ยังไม่มีข้อมูล"));
        }

        function showStats() {
            let risk = logs.filter(l => l.status.includes('🚨') || l.status.includes('⚠️')).length;
            alert("สถิติวันนี้ (CCTV):\nคุณมีความเสี่ยงทั้งหมด " + risk + " ครั้ง");
        }
    </script>
</body>
</html>
