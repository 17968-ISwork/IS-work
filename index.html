<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Personal Web App</title>
    <style>
        /* สไตล์แบบแอปมือถือ ทันสมัยและเบา */
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f0f2f5; margin: 0; display: flex; justify-content: center; padding: 20px; }
        .app-container { background: white; width: 100%; max-width: 400px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); overflow: hidden; text-align: center; padding-bottom: 30px; }
        .header-bg { background: linear-gradient(135deg, #007AFF, #00C6FF); height: 120px; }
        .profile-img { width: 100px; height: 100px; border-radius: 50%; border: 5px solid white; margin-top: -50px; background: #ddd; object-fit: cover; }
        h1 { margin: 15px 0 5px; color: #333; font-size: 24px; }
        p { color: #666; padding: 0 30px; line-height: 1.6; }
        .links-container { padding: 20px; display: flex; flex-direction: column; gap: 10px; }
        .link-btn { background: #f8f9fa; color: #333; text-decoration: none; padding: 15px; border-radius: 12px; font-weight: bold; transition: 0.3s; border: 1px solid #eee; }
        .link-btn:hover { background: #007AFF; color: white; transform: translateY(-2px); }
        .footer { font-size: 12px; color: #999; margin-top: 20px; }
    </style>
</head>
<body>

    <div class="app-container">
        <div class="header-bg"></div>
        
        <img src="https://via.placeholder.com/150" alt="Profile" class="profile-img">

        <h1>ยินดีต้อนรับสู่พื้นที่ของฉัน! 🌟</h1>
        <p>นี่คือเว็บแอปที่สร้างขึ้นเพื่อทดแทนแอปแบบติดตั้ง ประหยัดพื้นที่เครื่องไปได้เยอะเลยล่ะ!</p>

        <div class="links-container">
            <a href="https://facebook.com" class="link-btn">Facebook ของฉัน</a>
            <a href="https://github.com/17968-Iswork" class="link-btn">ดูโปรเจกต์ใน GitHub</a>
            <a href="mailto:example@email.com" class="link-btn">ส่งอีเมลหาฉัน</a>
            <button class="link-btn" onclick="shareApp()" style="cursor:pointer; width:100%;">แชร์แอปนี้ให้เพื่อน</button>
        </div>

        <div class="footer">© 2026 Create by Me | No Install Required</div>
    </div>

    <script>
        function shareApp() {
            if (navigator.share) {
                navigator.share({
                    title: 'เว็บแอปของฉัน',
                    url: window.location.href
                }).catch(console.error);
            } else {
                alert("ก๊อปปี้ลิงก์นี้ไปส่งให้เพื่อนได้เลย: " + window.location.href);
            }
        }
    </script>

</body>
</html>
