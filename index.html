<div id="page-dash" class="card" style="max-width: 500px;">
        <h2 id="welcomeTxt">ชื่อผู้ใช้</h2>
        <div class="info-box" style="background: #eef6ff; border-left: 5px solid #4a90e2; padding: 20px; border-radius: 10px; text-align: left; margin-bottom: 30px;">
            <b>วิเคราะห์พื้นฐาน:</b>
            <span id="theoryTxt">...</span>
        </div>

        <div style="text-align: left; margin-bottom: 20px;">
            <label style="font-weight: bold; display: block; margin-bottom: 10px;">วัดค่าเหงื่อรายบุคคล (ml)</label>
            <input type="number" id="sweatVal" placeholder="กรอกค่าเหงื่อที่วัดได้">
        </div>
        <button class="primary-btn" onclick="doAnalyze()">วิเคราะห์ผลลัพธ์</button>
    </div>

    <div id="page-result" class="card" style="max-width: 500px; padding: 0; overflow: hidden;">
        <div id="resColor" style="padding: 30px; font-size: 32px; font-weight: bold;">
            <span id="statusTxt"></span> <span id="resEmoji"></span>
        </div>
        
        <div style="padding: 30px; text-align: left;">
            <b id="advLabel">คำเตือน / คำแนะนำ</b><br>
            <p id="adviceTxt" style="margin-top: 10px; line-height: 1.6;"></p>

            <div style="display: flex; justify-content: space-between; align-items: center; background: #fff; border: 1px solid #eee; padding: 15px; border-radius: 15px; margin: 20px 0;">
                <span>เปิดระบบแจ้งเตือนดื่มน้ำ</span>
                <input type="checkbox" id="noteOnResult" onchange="syncNote(this)">
            </div>

            <div style="display: flex; gap: 10px;">
                <button class="res-btn" id="btnHist" style="flex: 1; padding: 12px; border-radius: 25px; border: none; color: white; font-weight: bold; cursor: pointer;">ประวัติการใช้งาน</button>
                <button class="res-btn" id="btnStat" style="flex: 1; padding: 12px; border-radius: 25px; border: none; color: white; font-weight: bold; cursor: pointer;">สถิติ</button>
            </div>
            
            <p style="text-align: center; color: #4a90e2; cursor: pointer; margin-top: 20px;" onclick="go('page-dash')">← กลับไปวิเคราะห์ใหม่</p>
        </div>
    </div>

    <script>
        // --- ส่วนที่แก้ไขใน JavaScript ---

        function doAnalyze() {
            const s = parseFloat(document.getElementById('sweatVal').value);
            if(isNaN(s)) return alert("กรุณากรอกค่าเหงื่อ");

            const resPage = document.getElementById('page-result');
            const resColor = document.getElementById('resColor');
            const statusTxt = document.getElementById('statusTxt');
            const emoji = document.getElementById('resEmoji');
            const adviceTxt = document.getElementById('adviceTxt');
            const advLabel = document.getElementById('advLabel');
            const btns = document.querySelectorAll('.res-btn');

            let st = "ปกติ", cl = "#58b682", em = "✅", ad = "ระดับน้ำในร่างกายปกติ รักษาสมดุลแบบนี้ต่อไปนะ!", label = "คำแนะนำ", btnCl = "#266c4a";

            if(s > 700) { 
                st = "ขาดน้ำ"; cl = "#f0aaaa"; em = "🚨"; ad = "ร่างกายขาดน้ำควรดื่มน้ำทันทีนะครับ ผมเป็นกำลังใจให้คุณนะ!"; label = "คำเตือน"; btnCl = "#ff4d4f";
                user.count++;
            } else if(s > 300) { 
                st = "เสี่ยง"; cl = "#f7d7ac"; em = "⚠️"; ad = "เริ่มเสียน้ำเยอะแล้ว จิบน้ำบ่อยๆ เพื่อป้องกันการขาดน้ำนะ"; label = "คำเตือน"; btnCl = "#ff9f43";
            }

            // แสดงผลหน้า Result
            statusTxt.innerText = st;
            emoji.innerText = em;
            resColor.style.background = cl;
            resColor.style.color = (st === "ปกติ") ? "white" : "#333";
            adviceTxt.innerText = ad;
            advLabel.innerText = label;
            btns.forEach(b => b.style.background = btnCl);

            // บันทึก Log
            user.logs.push({time: new Date().toLocaleString(), val: s, res: st});
            localStorage.setItem(user.name, JSON.stringify(user));
            
            go('page-result');
        }

        function syncNote(el) {
            // เชื่อมโยง Checkbox ระหว่างหน้า Dashboard กับหน้า Result
            if(el.checked) alert("🔔 ระบบเริ่มแจ้งเตือนดื่มน้ำทุก 1 ชั่วโมง");
        }

        // ปรับปรุงฟังก์ชันเดิมให้รองรับหน้าใหม่
        function go(id) {
            document.querySelectorAll('.landing-container, .card').forEach(el => el.classList.remove('active'));
            document.getElementById(id).classList.add('active');
        }
    </script>
