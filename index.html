<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>H2O Analytics - สรุปผล</title>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;500;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root { --primary: #007AFF; --gray-bg: #f5f7fa; --shadow: rgba(0,0,0,0.1); }
        body { font-family: 'Sarabun', sans-serif; background: linear-gradient(180deg, #d1e1f0 0%, #ffffff 100%); margin: 0; min-height: 100vh; display: flex; justify-content: center; align-items: center; }
        
        /* สไตล์หลักของการ์ดสรุปผล */
        .summary-card { background: white; width: 90%; max-width: 500px; border-radius: 25px; box-shadow: 0 10px 30px var(--shadow); overflow: hidden; position: relative; border: 1px solid #e0e0e0; text-align: center; padding-bottom: 30px; }
        .nav-header { padding: 20px; text-align: right; }
        .reg-btn-top { background: #ff4d4f; color: white; border: none; padding: 8px 18px; border-radius: 20px; cursor: pointer; font-size: 14px; }
        
        /* แถบสีแสดงสถานะด้านบน */
        .status-header { padding: 30px; color: white; font-size: 32px; font-weight: bold; position: relative; }
        .status-danger { background-color: #f0aaaa; color: #721c24; } /* ขาดน้ำ */
        .status-risk { background-color: #f7d7ac; color: #856404; }   /* เสี่ยง */
        .status-normal { background-color: #58b682; color: white; }  /* ปกติ */

        .icon-alert { font-size: 40px; margin-left: 10px; vertical-align: middle; }

        /* ส่วนเนื้อหาภายใน */
        .content-body { padding: 30px; text-align: left; color: #333; }
        .advice-title { font-weight: bold; margin-bottom: 10px; }
        .advice-text { margin-bottom: 25px; line-height: 1.6; }

        /* ส่วนตั้งค่าแจ้งเตือน (Checkbox กรอบเหลี่ยม) */
        .notify-setting { display: flex; justify-content: space-between; align-items: center; background: #fafafa; padding: 15px; border-radius: 12px; border: 1px solid #eee; margin-bottom: 25px; }
        .notify-label { font-size: 16px; }
        input[type="checkbox"] { width: 22px; height: 22px; cursor: pointer; accent-color: var(--primary); }

        /* ปุ่มด้านล่าง */
        .action-btns { display: flex; justify-content: space-around; gap: 15px; padding: 0 20px; }
        .btn-bottom { flex: 1; border: none; padding: 12px; border-radius: 25px; font-weight: bold; cursor: pointer; font-size: 15px; color: white; transition: 0.2s; }
        .btn-bottom:hover { opacity: 0.8; transform: translateY(-1px); }
        .btn-danger { background-color: #ff4d4f; }
        .btn-risk { background-color: #ff9f43; }
        .btn-normal { background-color: #266c4a; }

        /* --- สไตล์ Popup (Modal) สำหรับประวัติและสถิติ --- */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 1000; justify-content: center; align-items: center; }
        .modal-content { background: white; padding: 25px; border-radius: 15px; width: 90%; max-width: 450px; position: relative; max-height: 80vh; overflow-y: auto; }
        .close-modal { position: absolute; top: 10px; right: 15px; font-size: 24px; cursor: pointer; color: #aaa; }
        .history-list { list-style: none; padding: 0; text-align: left; }
        .history-item { border-bottom: 1px solid #eee; padding: 10px 0; display: flex; justify-content: space-between; font-size: 14px; }
    </style>
</head>
<body>

<div class="summary-card">
    <div class="nav-header">
        <button class="reg-btn-top">ลงทะเบียน</button>
    </div>

    <div id="statusHead" class="status-header status-danger">
        <span id="statusTitle">ขาดน้ำ</span>
        <span class="icon-alert">🚨</span>
    </div>

    <div class="content-body">
        <div class="advice-title">คำเตือน / คำแนะนำ</div>
        <p class="advice-text">
            ร่างกายขาดน้ำควรดื่มน้ำทันทีนะครับ ผมเป็นกำลังใจให้คุณนะ! สู้ๆ!
        </p>

        <div class="notify-setting">
            <span class="notify-label">เปิดระบบแจ้งเตือนดื่มน้ำ</span>
            <input type="checkbox" id="notifyCheck" onchange="toggleNotification()">
        </div>

        <div class="action-btns">
            <button class="btn-bottom btn-danger" onclick="openModal('historyModal')">ประวัติการใช้งาน</button>
            <button class="btn-bottom btn-danger" onclick="openModal('statsModal')">สถิติ</button>
        </div>
    </div>
</div>

<div id="historyModal" class="modal">
    <div class="modal-content">
        <span class="close-modal" onclick="closeModal('historyModal')">&times;</span>
        <h3>ประวัติการตรวจเหงื่อ</h3>
        <ul class="history-list" id="historyList">
            <li class="history-item"><span>19/03/2026 - 10:00</span> <b style="color:#dc3545">ขาดน้ำ (900ml)</b></li>
            <li class="history-item"><span>18/03/2026 - 15:30</span> <b style="color:#856404">เสี่ยง (500ml)</b></li>
            <li class="history-item"><span>18/03/2026 - 09:15</span> <b style="color:#28a745">ปกติ (200ml)</b></li>
        </ul>
    </div>
</div>

<div id="statsModal" class="modal">
    <div class="modal-content">
        <span class="close-modal" onclick="closeModal('statsModal')">&times;</span>
        <h3>สถิติค่าเหงื่อ (ml)</h3>
        <canvas id="sweatChart" width="400" height="250"></canvas>
    </div>
</div>

<script>
    // 🔔 ฟังก์ชันเปิด/ปิดระบบแจ้งเตือน
    function toggleNotification() {
        const isChecked = document.getElementById('notifyCheck').checked;
        if(isChecked) {
            alert("✅ เปิดระบบแจ้งเตือนดื่มน้ำเรียบร้อย! (ระบบจะเตือนคุณในหน้าเว็บนี้)");
            // ตัวอย่าง: แจ้งเตือนทุกๆ 3 วินาที (เพื่อทดสอบ)
            // ในเครื่องจริงคุณต้องเปลี่ยน 3000 เป็นเวลาที่ต้องการ (นาที * 60000)
            window.waterInterval = setInterval(() => {
                alert("🔔 กริ๊งๆ! ได้เวลาดื่มน้ำเพื่อสุขภาพแล้วครับ");
            }, 5000); 
        } else {
            alert("📴 ปิดระบบแจ้งเตือนเรียบร้อย");
            clearInterval(window.waterInterval);
        }
    }

    // 📦 ฟังก์ชันจัดการ Popup (Modal)
    function openModal(modalId) {
        document.getElementById(modalId).style.display = 'flex';
        if(modalId === 'statsModal') {
            renderChart(); // สร้างกราฟเมื่อเปิดหน้าสถิติ
        }
    }

    function closeModal(modalId) {
        document.getElementById(modalId).style.display = 'none';
    }

    // 📈 ฟังก์ชันสร้างกราฟเส้น (Chart.js)
    function renderChart() {
        const ctx = document.getElementById('sweatChart').getContext('2d');
        
        // ถ้ามีกราฟเดิมอยู่แล้วให้ลบทิ้งก่อนสร้างใหม่
        if(window.myChart instanceof Chart) {
            window.myChart.destroy();
        }

        // ข้อมูลตัวอย่างสำหรับกราฟ
        window.myChart = new Chart(ctx, {
            type: 'line', // กำหนดเป็นกราฟเส้น
            data: {
                labels: ['ครั้งที่ 1', 'ครั้งที่ 2', 'ครั้งที่ 3', 'ครั้งที่ 4', 'ครั้งที่ 5'], // แกน X
                datasets: [{
                    label: 'ปริมาณเหงื่อ (ml)',
                    data: [200, 500, 900, 400, 850], // ข้อมูลตัวอย่าง แกน Y
                    borderColor: '#007AFF', // สีเส้น
                    backgroundColor: 'rgba(0, 122, 255, 0.1)', // สีพื้นหลังใต้เส้น
                    borderWidth: 3,
                    tension: 0.4, // ความโค้งของเส้น
                    pointRadius: 5,
                    pointBackgroundColor: '#fff',
                    pointBorderColor: '#007AFF'
                }]
            },
            options: {
                responsive: true,
                scales: {
                    y: {
                        beginAtZero: true,
                        title: { display: true, text: 'มิลลิลิตร (ml)' }
                    }
                }
            }
        });
    }

    // คลิกด้านนอก Popup เพื่อปิด
    window.onclick = function(event) {
        if (event.target.className === 'modal') {
            event.target.style.display = "none";
        }
    }
</script>

</body>
</html>
