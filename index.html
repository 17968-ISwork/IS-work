<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dehydration Analytics - H2O</title>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;500;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root { 
            --primary: #4A90E2; 
            --bg-gradient: linear-gradient(180deg, #c7dbe8 0%, #f2f2f2 60%, #f2f2f2 100%);
            --text-blue: #97c8eb;
        }
        body { font-family: 'Sarabun', sans-serif; background: var(--bg-gradient); margin: 0; min-height: 100vh; }
        
        /* --- Navigation --- */
        .top-nav { display: flex; justify-content: flex-end; padding: 20px 40px; position: fixed; width: 100%; box-sizing: border-box; z-index: 100; }
        .reg-btn-nav { background: #c52828; color: white; border: none; padding: 10px 25px; border-radius: 20px; font-weight: bold; cursor: pointer; transition: 0.3s; }
        .reg-btn-nav:hover { background: #a02020; }

        /* --- Layout Containers --- */
        .container { display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; box-sizing: border-box; }
        .card { background: white; width: 90%; max-width: 500px; border-radius: 25px; box-shadow: 0 15px 40px rgba(0,0,0,0.08); padding: 40px; text-align: center; display: none; animation: fadeIn 0.5s; }
        .active { display: block !important; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* --- Landing Page Style --- */
        .title-3d {
            font-size: clamp(40px, 8vw, 80px); font-weight: 700; color: var(--text-blue); margin-bottom: 40px;
            text-shadow: 3px 3px 0px #fff, -1px -1px 0px #fff, 1px -1px 0px #fff, -1px 1px 0px #fff, 5px 5px 15px rgba(0,0,0,0.1);
        }
        .btn-outline {
            background: transparent; border: 2.5px solid var(--primary); color: var(--primary);
            padding: 12px 40px; border-radius: 30px; font-size: 18px; font-weight: bold; cursor: pointer; transition: 0.3s;
        }
        .btn-outline:hover { background: rgba(74, 144, 226, 0.1); }

        /* --- Dashboard Elements --- */
        .info-box { background: #eef6ff; border-left: 5px solid var(--primary); padding: 20px; border-radius: 10px; text-align: left; margin-bottom: 30px; }
        .info-box b { display: block; margin-bottom: 5px; color: #333; }
        
        .input-group { text-align: left; margin-bottom: 25px; }
        label { font-weight: bold; display: block; margin-bottom: 10px; }
        input, select { width: 100%; padding: 15px; border: 1px solid #eee; border-radius: 12px; background: #f9f9f9; box-sizing: border-box; font-size: 16px; margin-bottom: 15px; }
        
        .primary-btn { width: 100%; background: var(--primary); color: white; border: none; padding: 18px; border-radius: 30px; font-size: 18px; font-weight: bold; cursor: pointer; }

        /* --- Result Page Elements --- */
        .res-header { padding: 20px; border-radius: 15px; font-size: 32px; font-weight: bold; margin-bottom: 20px; }
        .bg-danger { background: #f0aaaa; color: #721c24; }
        .bg-warning { background: #f7d7ac; color: #856404; }
        .bg-success { background: #58b682; color: white; }

        .checkbox-container { display: flex; justify-content: space-between; align-items: center; background: #fff; border: 1px solid #eee; padding: 15px; border-radius: 15px; margin: 20px 0; }
        .footer-btns { display: flex; gap: 10px; }
        .btn-footer { flex: 1; padding: 12px; border-radius: 25px; border: none; color: white; font-weight: bold; cursor: pointer; font-size: 14px; }

        /* --- Modals --- */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 1000; justify-content: center; align-items: center; }
        .modal-content { background: white; padding: 30px; border-radius: 20px; width: 90%; max-width: 450px; position: relative; }
    </style>
</head>
<body>

    <div class="top-nav" id="mainNav" style="display: none;">
        <button class="reg-btn-nav" onclick="logout()">ออกจากระบบ</button>
    </div>

    <div class="container">
        <div
