<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dehydration Analysis</title>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;500;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root { --primary: #4A90E2; --bg: linear-gradient(180deg, #d1e1f0 0%, #f5f7fa 100%); }
        body { font-family: 'Sarabun', sans-serif; background: var(--bg); margin: 0; min-height: 100vh; }
        
        /* แถบเมนูด้านบน (ตามภาพ 195000.png) */
        .top-nav { display: flex; justify-content: flex-end; padding: 20px 40px; }
        .reg-btn-nav { background: #c52828; color: white; border: none; padding: 10px 25px; border-radius: 20px; font-weight: bold; cursor: pointer; }

        /* คอนเทนเนอร์หลัก */
        .container { display: flex; justify-content: center; align-items: flex-start; padding-top: 50px; }
        .card { background: white; width: 90%; max-width: 500px; border-radius: 25px; box-shadow: 0 15px 40px rgba(0,0,0,0.08); padding: 40px; text-align: center; display: none; }
        .active { display: block !important; }

        h2 { font-size: 28px; margin-bottom: 25px; color: #333; }
        
        /* กล่องวิเคราะห์พื้นฐาน (แถบฟ้าด้านซ้าย) */
        .info-box { background: #eef6ff; border-left: 5px solid var(--primary); padding: 20px; border-radius: 10px; text-align: left; margin-bottom: 30px; line-height: 1.6; }
        .info-box b { color: #333; display: block; margin-bottom: 5px; }

        /* ส่วนกรอกข้อมูล */
        .input-group { text-align: left; margin-bottom: 25px; }
        label { font-weight: bold; display: block; margin-bottom: 10px; font-size: 15px; }
        input[type="number"] { width: 100%; padding: 15px; border-radius: 12px; border: 1px solid #eee; background: #fafafa; font-size: 16px; box-sizing: border-box; }
        .primary-btn { width: 100%; background: var(--primary); color: white; border: none; padding: 18px; border-radius: 30px; font-size: 18px; font-weight: bold; cursor: pointer; margin-top: 10px; }

        /* ส่วนผลลัพธ์ (ตามภาพ 195020, 195030, 195042) */
        .res-header { padding: 20px; border-radius: 15px; font-size: 32px; font-weight: bold; margin-bottom: 20px; color: #333; }
        .bg-danger { background: #f0aaaa; } .bg-warning { background: #f7d7ac; } .bg-success { background: #58b682; color: white; }
        
        .checkbox-container { display: flex; justify-content: space-between; align-items: center; background: #fff; border: 1px solid #eee; padding: 15px; border-radius: 15px; margin: 20px 0; }
        .footer-btns { display: flex; gap: 10px; margin-top: 20px; }
        .btn-footer { flex: 1; padding: 12px; border-radius: 25px; border: none; color: white; font-weight: bold; cursor: pointer; }

        /* Modal */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 1000; justify-content: center; align-items: center; }
        .modal-content { background: white; padding: 30px; border-radius: 20px; width: 90%; max-width: 450px; position: relative; }
    </style>
</head>
<body>

    <div class="top-nav">
        <button class="reg-btn-nav" onclick="location.reload()">ลงทะเบียน</button>
    </div>

    <div class="container">
        <div id="page-input" class="card active">
            <h2 id="userName">ชื่อผู้ใช้</h2>
            
            <div class="info-box">
                <b>วิเคราะห์พื้นฐาน:</b>
                <span id="basicInfoText">ตามน้ำหนักตัว 67 กก. คุณควรดื่มน้ำวันละ 2211 มล.</span>
            </div>

            <div class="input-group">
                <label>วัดค่าเหงื่อรายบุคคล (ml)</label>
                <input type="number" id="sweatInp" placeholder="กรอกค่าเหงื่อที่วัดได้">
            </div>

            <button class="primary-btn" onclick="analyze()">วิเคราะห์ผลลัพธ์</button>
        </div>

        <div id="page-result" class="card">
            <div id="resColor" class="res-header">
                <span id="resTitle">ขาดน้ำ</span> <span id="resEmoji">🚨</span>
            </div>
            
            <div style="text-align: left; margin-bottom: 20px;">
                <b id="adviceLabel">คำเตือน</b><br>
                <span id="adviceText">ร่างกายขาดน้ำควรดื่มน้ำทันทีนะครับ</span>
            </div>

            <div class="checkbox-container">
                <span>เปิดระบบแจ้งเตือนดื่มน้ำ</span>
                <input type="checkbox" id="notiCheck" style="width:20px; height:20px;" onchange="toggleNoti()">
            </div>

            <div class="footer-btns">
                <button id="btnHist" class="btn-footer" onclick="openModal('modalHist')">ประวัติการใช้งาน</button>
                <button id="btnStat" class="btn-footer" onclick="openModal('modalStat')">สถิติ</button>
            </div>
            <p style="color:var(--primary); cursor:pointer; margin-top:20px;" onclick="showInputPage()">← กลับไปวิเคราะห์ใหม่</p>
        </div>
    </div>

    <div id="modalHist" class="modal">
        <div class="modal-content">
            <h3>ประวัติการใช้งาน</h3>
            <div id="histList">ไม่มีข้อมูลประวัติ</div>
            <button class="primary-btn" onclick="closeModal('modalHist')">ปิด</button>
        </div>
    </div>

    <div id="modalStat" class="modal">
        <div class="modal-content">
            <h3>สถิติค่าเหงื่อ (ml)</h3>
            <canvas id="myChart"></canvas>
            <button class="primary-btn" onclick="closeModal('modalStat')">ปิด</button>
        </div>
    </div>

    <script>
        let historyData = [];

        function analyze() {
            const val = document.getElementById('sweatInp').value;
            if(!val) return alert("กรุณากรอกค่าเหงื่อ");

            const head = document.getElementById('resColor');
            const title = document.getElementById('resTitle');
            const emoji = document.getElementById('resEmoji');
            const advL = document.getElementById('adviceLabel');
            const advT = document.getElementById('adviceText');
            const btns = document.querySelectorAll('.btn-footer');

            // ลบคลาสเก่าออกก่อน
            head.className = "res-header";
            btns.forEach(b => b.className = "btn-footer");

            if(val > 700) {
                head.classList.add('bg-danger');
                title.innerText = "ขาดน้ำ"; emoji.innerText = "🚨";
                advL.innerText = "คำเตือน"; advT.innerText = "ร่างกายขาดน้ำควรดื่มน้ำทันทีนะครับ";
                btns.forEach(b => b.classList.add('bg-danger'));
            } else if(val > 300) {
                head.classList.add('bg-warning');
                title.innerText = "เสี่ยง"; emoji.innerText = "⚠️";
                advL.innerText = "คำเตือน"; advT.innerText = "ร่างกายเสี่ยงขาดน้ำควรดื่มน้ำ";
                btns.forEach(b => b.classList.add('bg-warning'));
            } else {
                head.classList.add('bg-success');
                title.innerText = "ปกติ"; emoji.innerText = "✅";
                advL.innerText = "คำแนะนำ"; advT.innerText = "ควรดื่มน้ำประมาณนี้";
                btns.forEach(b => b.classList.add('bg-success'));
            }

            historyData.push(val);
            document.getElementById('page-input').classList.remove('active');
            document.getElementById('page-result').classList.add('active');
        }

        function showInputPage() {
            document.getElementById('page-result').classList.remove('active');
            document.getElementById('page-input').classList.add('active');
        }

        function toggleNoti() {
            if(document.getElementById('notiCheck').checked) {
                alert("🔔 ระบบเริ่มแจ้งเตือนดื่มน้ำทุก 1 ชั่วโมง");
            }
        }

        function openModal(id) { 
            document.getElementById(id).style.display = 'flex'; 
            if(id === 'modalStat') renderChart();
        }
        function closeModal(id) { document.getElementById(id).style.display = 'none'; }

        function renderChart() {
            const ctx = document.getElementById('myChart');
            new Chart(ctx, {
                type: 'line',
                data: {
                    labels: historyData.map((_, i) => `ครั้งที่ ${i+1}`),
                    datasets: [{ label: 'ค่าเหงื่อ (ml)', data: historyData, borderColor: '#4A90E2', tension: 0.3 }]
                }
            });
        }
    </script>
</body>
</html>
