<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dehydration Analytics - H2O Project</title>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;500;700&display=swap" rel="stylesheet">
    <style>
        /* --- 🎨 สไตล์หลักเพื่อให้เหมือนรูปเป๊ะ --- */
        :root {
            --bg-top: #c7dbe8;
            --bg-bottom: #f2f2f2;
            --text-blue: #97c8eb;
            --button-border: #4a90e2;
            --button-text: #4a90e2;
        }

        body {
            font-family: 'Sarabun', sans-serif;
            margin: 0;
            padding: 0;
            height: 100vh;
            background: linear-gradient(180deg, var(--bg-top) 0%, var(--bg-bottom) 60%, var(--bg-bottom) 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden; /* กันสกอร์บาร์ขึ้นหน้าแรก */
            position: relative;
        }

        /* Container หลัก */
        .page-container {
            width: 100%;
            max-width: 1000px;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        /* --- 📝 ข้อความ Dehydration ตัวนูนแบบ 3D --- */
        .title-dehydration {
            font-size: 80px;
            font-weight: 700;
            color: var(--text-blue);
            text-transform: capitalize;
            letter-spacing: 2px;
            margin-bottom: 30px;
            /* เทคนิค CSS shadow หลายชั้นเพื่อให้ดูนูน */
            text-shadow: 
                3px 3px 0px #fff,
                -1px -1px 0px #fff,
                1px -1px 0px #fff,
                -1px 1px 0px #fff,
                5px 5px 15px rgba(0,0,0,0.1);
            position: relative;
            z-index: 10;
        }

        /* --- 🔘 กลุ่มปุ่มกด --- */
        .button-group {
            display: flex;
            gap: 25px;
            margin-bottom: 50px;
            position: relative;
            z-index: 10;
        }

        .btn-outline {
            background: transparent;
            border: 2px solid var(--button-border);
            color: var(--button-text);
            padding: 12px 40px;
            border-radius: 25px;
            font-size: 18px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-outline:hover {
            background: rgba(74, 144, 226, 0.1);
            transform: translateY(-2px);
        }

        /* --- 🧼 ตกแต่ง ฟองสบู่ (CSS Only) --- */
        .bubbles {
            position: absolute;
            bottom: 15%;
            left: 8%;
            display: flex;
            gap: 10px;
            z-index: 5;
        }

        .bubble {
            width: 30px; height: 30px;
            background: rgba(255, 255, 255, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.5);
            border-radius: 50%;
            position: relative;
            box-shadow: inset 0 0 10px rgba(255, 255, 255, 0.5);
        }

        .bubble::after { /* จุดแววบนฟอง */
            content: '';
            position: absolute;
            top: 5px; left: 5px;
            width: 8px; height: 8px;
            background: rgba(255, 255, 255, 0.7);
            border-radius: 50%;
        }

        .bubble-sm { width: 15px; height: 15px; margin-top: 15px; }
        .bubble-md { width: 22px; height: 22px; margin-top: 5px; }

        /* --- 💧 ตกแต่ง H2O 3D (CSS Only) --- */
        .h2o-logo {
            position: absolute;
            bottom: 12%;
            right: 8%;
            font-size: 65px;
            font-weight: 700;
            color: var(--text-blue);
            z-index: 5;
            /* เทคนิค CSS shadow ขั้นสูงเพื่อให้ดูนูนและแวววาวเหมือนน้ำ/แก้ว */
            text-shadow: 
                2px 2px 0px rgba(255,255,255,0.8),
                -1px -1px 0px rgba(255,255,255,0.8),
                1px -1px 0px rgba(255,255,255,0.8),
                -1px 1px 0px rgba(255,255,255,0.8),
                5px 10px 20px rgba(0,0,0,0.15),
                inset 0 0 15px rgba(255,255,255,0.5);
        }

        .h2o-logo sub {
            font-size: 40px;
            vertical-align: sub;
        }

        /* =========================================
           🛠️ ส่วนของฟังก์ชัน (Login, Dashboard) 
           ========================================= */
        .app-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            display: none; /* ซ่อนไว้ก่อน */
            justify-content: center;
            align-items: center;
            z-index: 100;
        }

        .active-overlay { display: flex; animation: fadeIn 0.3s; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        .form-card {
            background: white;
            padding: 30px;
            border-radius: 20px;
            width: 90%;
            max-width: 400px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            position: relative;
        }

        .close-btn { position: absolute; top: 10px; right: 15px; cursor: pointer; color: #aaa; }

        input, select { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ddd; border-radius: 10px; box-sizing: border-box; }
        .primary-btn { width: 100%; background: #4a90e2; color: white; border: none; padding: 12px; border-radius: 20px; cursor: pointer; font-weight: bold; margin-top: 10px; }
        
        /* สไตล์หน้า Dashboard */
        .dashboard { max-width: 600px; margin-top: 20px; text-align: left; background: white; padding: 20px; border-radius: 15px; display: none; }
        .active-dash { display: block; }
    </style>
</head>
<body>

    <div class="page-container" id="frontPage">
        <h1 class="title-dehydration">Dehydration</h1>
        
        <div class="button-group">
            <button class="btn-outline" onclick="openForm('loginForm')">เข้าสู่ระบบ</button>
            <button class="btn-outline" onclick="openForm('regForm')">ลงทะเบียน</button>
        </div>

        <div class="bubbles">
            <div class="bubble bubble-sm"></div>
            <div class="bubble"></div>
            <div class="bubble bubble-md"></div>
        </div>

        <div class="h2o-logo">H<sub>2</sub>O</div>
    </div>

    <div class="container active-dash" id="dashboardPage" style="display:none; padding: 20px;">
        <div class="dashboard active-dash">
            <h2 id="helloUser">สวัสดีครับ</h2>
            <button class="primary-btn" onclick="location.reload()">ออกจากระบบ</button>
            <hr>
            <h4>กรอกค่าเหงื่อ (ml)</h4>
            <input type="number" id="sweatIn">
            <button class="primary-btn" onclick="checkStatus()">วิเคราะห์ผล</button>
            <p id="resultText"></p>
        </div>
    </div>


    <div class="app-overlay" id="formOverlay">
        
        <div class="form-card" id="regForm" style="display:none;">
            <span class="close-btn" onclick="closeForm()">×</span>
            <h3>ลงทะเบียน</h3>
            <input type="text" id="rName" placeholder="ชื่อ-นามสกุล">
            <input type="password" id="rPass" placeholder="รหัสผ่าน (6 หลัก)" maxlength="6">
            <input type="number" id="rWeight" placeholder="น้ำหนัก (กก.)">
            <button class="primary-btn" onclick="register()">ตกลง</button>
        </div>

        <div class="form-card" id="loginForm" style="display:none;">
            <span class="close-btn" onclick="closeForm()">×</span>
            <h3>เข้าสู่ระบบ</h3>
            <input type="text" id="lName" placeholder="ชื่อ">
            <input type="password" id="lPass" placeholder="รหัสผ่าน">
            <button class="primary-btn" onclick="login()">เข้าสู่ระบบ</button>
        </div>
    </div>

    <script>
        let currentUser = null;

        function openForm(formId) {
            document.getElementById('formOverlay').classList.add('active-overlay');
            document.getElementById('regForm').style.display = 'none';
            document.getElementById('loginForm').style.display = 'none';
            document.getElementById(formId).style.display = 'block';
        }

        function closeForm() {
            document.getElementById('formOverlay').classList.remove('active-overlay');
        }

        function register() {
            const data = {
                name: document.getElementById('rName').value,
                pass: document.getElementById('rPass').value,
                weight: document.getElementById('rWeight').value
            };
            if(!data.name || data.pass.length < 6) return alert("กรุณากรอกข้อมูลและรหัส 6 หลัก");
            localStorage.setItem(data.name, JSON.stringify(data));
            alert("สมัครสำเร็จ!");
            openForm('loginForm');
        }

        function login() {
            const name = document.getElementById('lName').value;
            const pass = document.getElementById('lPass').value;
            const stored = JSON.parse(localStorage.getItem(name));
            if(stored && stored.pass === pass) {
                currentUser = stored;
                loginSuccess();
            } else { alert("รหัสผิด"); }
        }

        function loginSuccess() {
            closeForm();
            document.getElementById('frontPage').style.display = 'none';
            document.getElementById('dashboardPage').style.display = 'block';
            document.getElementById('helloUser').innerText = "สวัสดี, " + currentUser.name;
            // เปิดแจ้งเตือนพื้นฐาน
            setInterval(() => { alert("🔔 อย่าลืมดื่มน้ำนะครับ!"); }, 600000); // ทุก 10 นาที
        }

        function checkStatus() {
            const sweat = document.getElementById('sweatIn').value;
            let res = sweat > 500 ? "เสี่ยงขาดน้ำ 🚨" : "ปกติ ✅";
            document.getElementById('resultText').innerHTML = `<b>ผลลัพธ์: ${res}</b><br>จิบน้ำบ่อยๆ นะคนเก่ง!`;
        }
    </style>

</body>
</html>
