<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dehydration Project - Ice Edition</title>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-gradient: linear-gradient(180deg, #c7dbe8 0%, #f2f2f2 60%, #f2f2f2 100%);
            --text-blue: #4a90e2;
            --btn-color: #4a90e2;
        }

        body {
            font-family: 'Sarabun', sans-serif;
            margin: 0; padding: 20px;
            background: var(--bg-gradient);
            min-height: 100vh;
            display: flex; justify-content: center; align-items: flex-start;
        }

        .card {
            background: white; padding: 30px; border-radius: 25px;
            width: 100%; max-width: 450px; display: none;
            box-shadow: 0 15px 35px rgba(0,0,0,0.1);
            position: relative;
        }

        .active { display: block !important; }

        /* ส่วนหัวและปุ่มออกจากระบบ */
        .header-ui { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .logout-btn { color: #ff4d4d; cursor: pointer; font-size: 14px; font-weight: bold; }

        h2 { text-align: center; color: #444; margin-bottom: 20px; }
        
        input, select {
            width: 100%; padding: 14px; margin: 10px 0;
            border: 1px solid #eee; border-radius: 12px; background: #f9f9f9;
            box-sizing: border-box; font-size: 16px;
        }

        .primary-btn {
            width: 100%; background: var(--btn-color); color: white;
            border: none; padding: 16px; border-radius: 30px;
            font-size: 18px; font-weight: bold; cursor: pointer; margin-top: 15px;
        }

        /* กล่องแสดงสถานะที่รับจาก Bluetooth */
        .stat-box { 
            background: #f0f7ff; padding: 25px; border-radius: 20px; 
            text-align: center; margin: 20px 0; 
            border: 2px solid var(--btn-color);
        }

        .val-display { font-size: 48px; font-weight: bold; color: var(--btn-color); margin: 10px 0; }

        /* ปุ่มคู่ด้านล่าง (ประวัติ & สถิติ) */
        .footer-btns { display: flex; gap: 15px; margin-top: 25px; }
        .btn-sub {
            flex: 1; padding: 12px; border: 2px solid var(--btn-color);
            background: white; color: var(--btn-color);
            border-radius: 15px; font-weight: bold; cursor: pointer;
        }
    </style>
</head>
<body>

    <div id="page-reg" class="card active">
        <h2>ลงทะเบียนผู้ใช้</h2>
        <input type="text" id="rName" placeholder="ชื่อ-นามสกุล">
        <select id="rGender">
            <option value="">เลือกเพศ</option>
            <option value="ชาย">ชาย</option>
            <option value="หญิง">หญิง</option>
        </select>
        <input type="number" id="rAge" placeholder="อายุ">
        <input type="number" id="rWeight" placeholder="น้ำหนัก (กก.)">
        <input type="number" id="rHeight" placeholder="ส่วนสูง (ซม.)">
        <button class="primary-btn" onclick="doRegister()">บันทึกข้อมูล</button>
    </div>

    <div id="page-dash" class="card">
        <div class="header-ui">
            <b id="userLabel"></b>
            <span class="logout-btn" onclick="location.reload()">ออกจากระบบ</span>
        </div>

        <button class="primary-btn" style="background:#28a745;" onclick="connectBLE()">🔵 เชื่อมต่อบลูทูธ</button>

        <div id="displayBox" class="stat-box">
            <h3 id="statusTxt">รอรับข้อมูล...</h3>
            <div class="val-display" id="valShow">0.00</div>
            <p id="adviceTxt" style="font-size: 14px; color: #666;">กรุณาสวมใส่อุปกรณ์</p>
        </div>

        <div id="reminderBox" style="display:none; text-align:center; padding:10px; background:#fff3cd; border-radius:10px;">
            <label><input type="checkbox" id="remOn"> 🔔 เปิดแจ้งเตือนดื่มน้ำ</label>
        </div>

        <div class="footer-btns">
            <button class="btn-sub" onclick="showHistory()">📜 ประวัติ</button>
            <button class="btn-sub" onclick="showStats()">📊 สถิติ (CCTV)</button>
        </div>
    </div>

    <script>
        let user = {};
        let logs = [];

        function doRegister() {
            user = {
                name: document.getElementById('rName').value,
                gender: document.getElementById('rGender').value,
                weight: document.getElementById('rWeight').value
            };
            if(!user.name || !user.gender) return alert("กรุณากรอกข้อมูลให้ครบ");
            document.getElementById('userLabel').innerText = "คุณ " + user.name;
            document.getElementById('page-reg').classList.remove('active');
            document.getElementById('page-dash').classList.add('active');
        }

        // --- ส่วนเชื่อมต่อบลูทูธ ---
        async function connectBLE() {
            try {
                const device = await navigator.bluetooth.requestDevice({
                    // ************************************************************
                    // <span style="color:red">แก้ไขชื่อบลูทูธของไอซ์ตรงนี้นะ:</span>
                    filters: [{ name: '<span style="color:red">Ice_Sensor_Device</span>' }], 
                    
                    // <span style="color:red">หรือใส่รหัส Service UUID ตรงนี้:</span>
                    optionalServices: ['<span style="color:red">0000180d-0000-1000-8000-00805f9b34fb</span>'] 
                    // ************************************************************
                });

                const server = await device.gatt.connect();
                alert("เชื่อมต่อสำเร็จ! ระบบวิเคราะห์อัตโนมัติเริ่มทำงาน");

                // จำลองการรับข้อมูลทุก 5 วินาที (Mockup Data)
                setInterval(() => {
                    let mockValue = Math.floor(Math.random() * 1000);
                    autoAnalyze(mockValue);
                }, 5000);

            } catch (error) {
                alert("การเชื่อมต่อล้มเหลว: " + error);
            }
        }

        function autoAnalyze(val) {
            let st = "ปกติ ✅", ad = "รักษาสุขภาพแบบนี้ต่อไปนะ", color = "#f0f7ff";
            
            // ใช้เกณฑ์ต่างกันตามเพศ (ชาย/หญิง)
            let limit = (user.gender === 'ชาย') ? 600 : 500;

            if(val > limit * 1.5) {
                st = "ขาดน้ำ 🚨"; ad = "อันตราย! ควรดื่มน้ำเพิ่มทันที"; color = "#f8d7da";
                document.getElementById('reminderBox').style.display = 'block';
            } else if (val > limit) {
                st = "เสี่ยงขาดน้ำ ⚠️"; ad = "เริ่มเสียเหงื่อเยอะ จิบน้ำบ่อยๆ นะ"; color = "#fff3cd";
                document.getElementById('reminderBox').style.display = 'block';
            } else if (val < 50) {
                st = "อิ่มน้ำเกินไป 💧"; ad = "ปริมาณน้ำในร่างกายสูงมาก"; color = "#e3f2fd";
            }

            document.getElementById('statusTxt').innerText = st;
            document.getElementById('valShow').innerText = val;
            document.getElementById('adviceTxt').innerText = ad;
            document.getElementById('displayBox').style.background = color;

            logs.push({ time: new Date().toLocaleTimeString(), status: st, val: val });
        }

        function showHistory() {
            let historyText = logs.slice(-5).map(l => `${l.time} : ${l.status}`).join('\n');
            alert("ประวัติการใช้งานล่าสุด:\n" + (historyText || "ยังไม่มีข้อมูล"));
        }

        function showStats() {
            let risk = logs.filter(l => l.status.includes('🚨') || l.status.includes('⚠️')).length;
            alert("สถิติความเสี่ยงวันนี้ (CCTV):\nคุณมีภาวะขาดน้ำ/เสี่ยง รวม " + risk + " ครั้ง");
        }
    </script>
</body>
</html>
