<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบคลังข้อสอบจำลอง TCAS ของจริง 100%</title>
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --success: #10b981;
            --danger: #ef4444;
            --background: #f3f4f6;
            --card: #ffffff;
            --text: #1f2937;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'ChulaCharasNew', 'Sarabun', sans-serif;
        }

        body {
            background-color: var(--background);
            color: var(--text);
            padding: 20px;
            line-height: 1.6;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            background: var(--card);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        h1, h2, h3 {
            text-align: center;
            margin-bottom: 20px;
            color: var(--primary);
        }

        .btn {
            display: block;
            width: 100%;
            padding: 12px 20px;
            margin: 10px 0;
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            transition: background 0.2s;
            text-align: left;
        }

        .btn:hover {
            background-color: var(--primary-hover);
        }

        .btn-center {
            text-align: center;
        }

        .choice-btn {
            background-color: #f9fafb;
            color: var(--text);
            border: 2px solid #e5e7eb;
        }

        .choice-btn:hover {
            background-color: #f3f4f6;
        }

        .correct {
            background-color: var(--success) !important;
            color: white;
            border-color: var(--success);
        }

        .wrong {
            background-color: var(--danger) !important;
            color: white;
            border-color: var(--danger);
        }

        .hidden {
            display: none;
        }

        .progress-bar {
            width: 100%;
            background-color: #e5e7eb;
            height: 10px;
            border-radius: 5px;
            margin-bottom: 20px;
            overflow: hidden;
        }

        .progress {
            width: 0%;
            height: 100%;
            background-color: var(--success);
            transition: width 0.3s;
        }

        .explanation {
            margin-top: 15px;
            padding: 15px;
            background-color: #eff6ff;
            border-left: 4px solid #3b82f6;
            border-radius: 4px;
        }

        .score-text {
            font-size: 24px;
            text-align: center;
            margin: 20px 0;
            font-weight: bold;
        }

        .badge {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: bold;
            color: white;
        }
        .bg-medium { background-color: #f59e0b; }
        .bg-hard { background-color: #ef4444; }
        
        .counter-info {
            text-align: center;
            font-size: 14px;
            color: #4b5563;
            margin-bottom: 10px;
            background: #f3f4f6;
            padding: 5px;
            border-radius: 6px;
        }
    </style>
</head>
<body>

<div class="container">
    <div id="category-screen">
        <h1>ระบบคลังข้อสอบจำลอง TCAS ของจริง</h1>
        <p style="text-align:center; margin-bottom: 20px; color: #6b7280;">📝 ชุดละ 30 ข้อ | ครั้งที่ 1-10 (ระดับกลาง) ➡️ ครั้งที่ 11 ขึ้นไป (ระดับยาก)</p>
        <button class="btn btn-center" onclick="showSubCategory('gat')">TGAT (GAT)</button>
        <button class="btn btn-center" onclick="showSubCategory('pat')">TPAT (PAT 1)</button>
        <button class="btn btn-center" onclick="showSubCategory('alevel')">A-Level (สายศิลป์-คำนวณ)</button>
        <button class="btn btn-center choice-btn" style="text-align: center; margin-top: 20px; font-size: 12px;" onclick="resetHistory()">🗑️ ล้างประวัติเพื่อเริ่มนับรอบที่ 1 ใหม่</button>
    </div>

    <div id="sub-category-screen" class="hidden">
        <h2 id="sub-title">เลือกวิชา / พาร์ทข้อสอบ</h2>
        <div id="sub-options"></div>
        <button class="btn btn-center choice-btn" onclick="goBack('category-screen')">⬅️ ย้อนกลับหน้าหลัก</button>
    </div>

    <div id="quiz-screen" class="hidden">
        <div class="counter-info" id="history-counter-text">รอบฝึกฝนปัจจุบัน: ครั้งที่ 1</div>
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
            <div>
                <span id="quiz-info-title" style="font-weight: bold; color: var(--primary);">ข้อสอบ</span>
                <span id="difficulty-badge" class="badge">ระดับ</span>
            </div>
            <span id="question-number">ข้อที่ 1/30</span>
        </div>
        <div class="progress-bar"><div id="progress" class="progress"></div></div>
        
        <h3 id="question-text" style="text-align: left; color: var(--text); margin-bottom: 20px; white-space: pre-line;">โจทย์กำลังโหลด...</h3>
        
        <div id="choices-container"></div>
        
        <div id="explanation-container" class="explanation hidden">
            <strong>💡 เฉลยละเอียด:</strong> <span id="explanation-text"></span>
        </div>
        
        <button id="next-btn" class="btn btn-center hidden" onclick="nextQuestion()">ข้อถัดไป ➡️</button>
    </div>

    <div id="result-screen" class="hidden">
        <h2>🎉 สรุปผลคะแนนเรียบร้อย!</h2>
        <div class="score-text" id="final-score">0 / 30 คะแนน</div>
        <p id="evaluation-text" style="text-align: center; margin-bottom: 20px; font-weight: bold;"></p>
        <button class="btn btn-center" onclick="restartQuiz()">🔄 ทำรอบถัดไป</button>
        <button class="btn btn-center choice-btn" onclick="goBack('category-screen')">🏠 กลับหน้าหลัก</button>
    </div>
</div>

<script>
// 📌 คลังข้อสอบจริง TGAT 1 และ TGAT 2 (เติมเต็มส่วนที่ขาดหายและปรับโครงสร้างครบถ้วน)
const quizData = {
    gat_eng: {
        medium: [
            { q: "Situation: At a coffee shop.\nBarista: What can I get for you today?\nCustomer: __________. Can I get an iced Americano, please?", c: ["I’m not sure yet.", "I’d like to sit inside.", "Just a moment, please.", "Give me the usual."], a: 2, exp: "ขอเวลาเลือกสักครู่ (Just a moment, please) แล้วสั่งต่อทันที สุภาพและตรงบริบทที่สุด" },
            { q: "Situation: Two friends talking about a movie.\nJane: I thought the new sci-fi movie was a bit overrated.\nMark: __________. The plot didn't make any sense at all.", c: ["I couldn't agree more.", "I beg to differ.", "That’s not the case.", "You must be joking."], a: 0, exp: "Mark มีความคิดเห็นเชิงลบเหมือนกัน จึงใช้สำนวน เห็นด้วยอย่างยิ่ง (I couldn't agree more)" },
            { q: "The manager decided to _________ the weekly meeting due to the power outage.", c: ["cancel", "postpone", "resume", "organize"], a: 1, exp: "Postpone แปลว่า เลื่อนกำหนดการออกไป เหมาะสมที่สุดกับเหตุการณ์ไฟดับชั่วคราว" },
            { q: "The presentation _________ by the marketing team before the CEO arrived.", c: ["had been completed", "has completed", "was completing", "completes"], a: 0, exp: "ใช้ Past Perfect เพราะเสร็จก่อนที่ CEO จะมาถึง (Past Simple) และประธานถูกกระทำ" },
            { q: "Situation: At the reception desk.\nVisitor: Excuse me, is Mr. Benson in his office?\nReceptionist: Yes, but he is currently in a meeting. _________?", c: ["Would you like to leave a message", "Could you tell me why", "Why don't you come back tomorrow", "Can you show me your ID"], a: 0, exp: "เสนอทางเลือกให้ฝากข้อความไว้ (leave a message) สุภาพที่สุดสำหรับพนักงานต้อนรับ" },
            { q: "Jane is very _________ about her test results; she has been studying day and night.", c: ["indifferent", "anxious", "careless", "ignorant"], a: 1, exp: "คนที่ตั้งใจอ่านหนังสือมากย่อมรู้สึก Anxious (กังวล/ใจจดใจจ่อ) กับผลสอบ" },
            { q: "Neither the teacher nor the students _________ prepared for the sudden fire drill yesterday.", c: ["is", "are", "was", "were"], a: 3, exp: "Neither...nor... กริยาผันตามประธานตัวหลัง (the students) เป็นพหูพจน์และเกิดในอดีตใช้ were" },
            { q: "Situation: Offering help.\nSecretary: You look like you're struggling with those heavy boxes. _________?\nBoss: Thank you, that's very kind of you.", c: ["Can I give you a hand", "Is it your business", "Why are you doing that", "Do you need money"], a: 0, exp: "Can I give you a hand? เป็นสำนวนเสนอความช่วยเหลือยอดนิยม แปลว่า ให้ช่วยไหม" },
            { q: "Although she felt extremely tired, she _________ working until midnight to finish the project.", c: ["kept", "stopped", "avoided", "postponed"], a: 0, exp: "Although บอกความขัดแย้ง เหนื่อยแต่ก็ยังทำต่อ Kept + V.ing คือทำบางสิ่งอย่างต่อเนื่อง" },
            { q: "The company's profits have grown _________ since they launched the new campaign.", c: ["significantly", "slightly", "rarely", "carelessly"], a: 0, exp: "Significantly แปลว่า อย่างมีนัยสำคัญ/อย่างมาก สอดคล้องกับผลกำไรที่เติบโตได้ดี" },
            { q: "If it _________ rain tomorrow, we will go on a picnic as planned.", c: ["doesn't", "won't", "didn't", "hasn't"], a: 0, exp: "If-Clause Type 1 โครงสร้าง If + Present Simple ปฏิเสธใช้ doesn't คู่กับประธานเอกพจน์" },
            { q: "The newly opened restaurant is famous _________ its authentic Italian pasta.", c: ["for", "with", "at", "by"], a: 0, exp: "Famous คู่กับบุพบท for เสมอ (famous for = มีชื่อเสียงด้าน...)" },
            { q: "Situation: Asking for an opinion.\nArtist: What do you think of my latest painting?\nCritic: To be honest, I think _________.", c: ["it's absolute masterpiece", "it lacks some depth and color balance", "you should stop painting", "I don't like you"], a: 1, exp: "นักวิจารณ์ (Critic) วิจารณ์เชิงเทคนิคอย่างเป็นมืออาชีพและสุภาพ" },
            { q: "Passengers are strictly _________ from smoking in the lavatories during the flight.", c: ["allowed", "prohibited", "advised", "encouraged"], a: 1, exp: "Prohibited แปลว่า ถูกสั่งห้ามตามกฎหมายหรือระเบียบการบิน" },
            { q: "I look forward to _________ from you soon regarding my job application.", c: ["hear", "hearing", "heard", "be heard"], a: 1, exp: "Look forward to ต้องตามด้วยคำนาม หรือ V.ing (Gerund) เสมอ" },
            { q: "Tom's car broke down on the way to work, _________ he had to take the subway instead.", c: ["so", "but", "because", "although"], a: 0, exp: "รถเสีย 'ดังนั้น' (so) เขาจึงต้องไปรถไฟใต้ดินแทน เป็นเหตุเป็นผลกัน" },
            { q: "We need to find a _________ solution to this water shortage problem, not just a temporary fix.", c: ["permanent", "brief", "sudden", "unstable"], a: 0, exp: "ต้องการทางแก้ปัญหาแบบ 'ถาวร' (permanent) เพื่อขัดแย้งกับคำว่า ชั่วคราว (temporary)" },
            { q: "The delicious smell of freshly baked bread _________ everyone into the bakery.", c: ["attracted", "rejected", "distracted", "warned"], a: 0, exp: "กลิ่นหอมดึงดูด (attracted) ผู้คนเข้ามาในร้าน" },
            { q: "Situation: On the phone.\nCaller: Could I speak to Linda, please?\nReceiver: __________. I'll go get her for you.", c: ["Hold on a second", "She is out", "Wrong number", "Who are you"], a: 0, exp: "Hold on a second (ถือสายรอสักครู่) เหมาะสมที่สุดเมื่อจะเดินไปตามสายให้" },
            { q: "The flight was delayed _________ the heavy snowstorm at the airport.", c: ["because of", "inspire of", "although", "furthermore"], a: 0, exp: "Because of ตามด้วยกลุ่มคำนาม แปลว่า 'เนื่องมาจาก' พายุหิมะตกหนัก" },
            { q: "You _________ wear a helmet while riding a motorcycle for your own safety.", c: ["must", "might", "could", "may"], a: 0, exp: "Must ใช้แสดงกฎเกณฑ์ข้อบังคับหรือความจำเป็นที่ต้องทำเด็ดขาด" },
            { q: "The students _________ the classroom before the bell rang.", c: ["had left", "have left", "leave", "are leaving"], a: 0, exp: "เด็กนักเรียนออกไปก่อน (เกิดก่อนเป็น Past Perfect) ก่อนกระดิ่งดัง (Past Simple)" },
            { q: "The book was so _________ that I couldn't put it down until I finished it.", c: ["boring", "fascinating", "tiring", "predictable"], a: 1, exp: "Fascinating แปลว่า น่าหลงใหล/สนุกมากๆ สอดคล้องกับอาการอ่านจนวางไม่ลง" },
            { q: "The price of organic vegetables is usually higher than _________ of conventional ones.", c: ["that", "those", "this", "these"], a: 0, exp: "ใช้คำสรรพนามกลุ่มชี้เฉพาะ 'that' เพื่อแทนคำนามเอกพจน์ 'the price' ที่อยู่ข้างหน้า" },
            { q: "Situation: Expressing sympathy.\nA: I failed my driving test again today.\nB: __________. Better luck next time!", c: ["What a pity!", "Congratulations!", "That’s awesome!", "You’re welcome."], a: 0, exp: "What a pity! เป็นคำอุทานแสดงความเห็นใจและเสียดาย แปลว่า น่าเสียดายจัง" },
            { q: "She is capable _________ speaking four languages fluently.", c: ["of", "at", "in", "with"], a: 0, exp: "รูปคุณศัพท์ Capable ต้องใช้คู่กับคู่บุพบท of เสมอ (capable of + V.ing)" },
            { q: "The heavy traffic in Bangkok is a major cause of air _________.", c: ["pollution", "solution", "evolution", "institution"], a: 0, exp: "Air pollution แปลว่า มลพิษทางอากาศ" },
            { q: "He _________ a lot of money on video games last month.", c: ["spent", "cost", "paid", "earned"], a: 0, exp: "คนใช้เงินกับสิ่งของ โครงสร้างคือ Spend money on something ในอดีตช่องสองจึงเป็น spent" },
            { q: "Situation: Dinner invitation.\nPeter: Would you like to join us for dinner tonight?\nMary: __________, but I have to finish my assignment.", c: ["I'd love to", "No way", "Forget it", "Yes, please"], a: 0, exp: "I'd love to (ฉันอยากไปนะ) สุภาพที่สุดเพื่อตอบรับก่อนจะตามด้วยคำปฏิเสธขัดแย้ง" },
            { q: "This smartphone app is designed to help users track their _________ calorie intake.", c: ["daily", "rare", "annual", "ancient"], a: 0, exp: "การนับแคลอรีอาหารควรนับเป็น รายวัน (daily)" }
        ],
        hard: [
            { q: "In a business negotiation, if a party is described as 'adamant', it means they are _________.", c: ["flexible and open to compromises", "refusing to change their mind", "incapable of understanding terms", "indifferent to the final outcome"], a: 1, exp: "Adamant แปลว่า ยืนกราน มั่นคง ไม่ยอมเปลี่ยนความคิดหรือคำสั่งเด็ดขาด" },
            { q: "Not only _________ the prestigious award, but she also donated the entire prize money to charity.", c: ["she won", "did she win", "she had won", "has she won"], a: 1, exp: "โครงสร้าง Inversion เมื่อขึ้นประโยคด้วยปฏิเสธ Not only ต้องใช้กริยาช่วย (did) ขึ้นก่อนประธาน" },
            { q: "The economic analysts predict that the market volatility will not _________ until the central bank stabilizes interest rates.", c: ["subside", "escalate", "fluctuate", "accumulate"], a: 0, exp: "Subside แปลว่า ลดน้อยลงหรือบรรเทาลง ใช้กับความผันผวนของตลาด" },
            { q: "Had the medical team acted more swiftly, the patient's condition _________ to this critical stage.", c: ["would not deteriorate", "will not have deteriorated", "would not have deteriorated", "did not deteriorate"], a: 2, exp: "รูปประโยคแบบลดรูป If-Clause Type 3 (Had + S + V.3) ประโยคหลักต้องตามด้วย would not have + V.3" },
            { q: "The attorney suggested that the disputed contract be rendered _________ due to a breach of confidentiality.", c: ["null and void", "binding and legal", "lucrative and profitable", "explicit and clear"], a: 0, exp: "Null and void เป็นสำนวนกฎหมายขั้นสูง แปลว่า เป็นโมฆะ/ไม่มีผลผുകൂพันทางกฎหมาย" },
            { q: "Despite his status as a novice writer, his debut novel displayed a _________ grasp of complex human psychology.", c: ["superficial", "profound", "primitive", "negligible"], a: 1, exp: "Profound แปลว่า ลึกซึ้ง ขัดแย้งกับคำว่า นักเขียนหน้าใหม่ (novice)" },
            { q: "The government has implemented stringent measures to prevent the _________ of counterfeit currency in the local economy.", c: ["proliferation", "stagnation", "depreciation", "liquidation"], a: 0, exp: "Proliferation แปลว่า การแพร่ระบาดหรือการเพิ่มขึ้นอย่างรวดเร็วของสิ่งไม่ดี" },
            { q: "Seldom _________ such a breathtaking performance by a young theatrical troupe in recent years.", c: ["we have witnessed", "have we witnessed", "did we witnessed", "we witnessed"], a: 1, exp: "หลัก Inversion เมื่อขึ้นต้นด้วยปฏิเสธความถี่ต่ำ Seldom ต้องสลับที่ กริยาช่วย + ประธาน" },
            { q: "The researcher's conclusions were criticized for being based on _________ data rather than rigorous empirical evidence.", c: ["anecdotal", "verifiable", "statutory", "authentic"], a: 0, exp: "Anecdotal data แปลว่า ข้อมูลจากการบอกเล่าโคมลอย ขัดแย้งกับหลักฐานเชิงประจักษ์ (empirical)" },
            { q: "The diplomatic ties between the two nations began to _________ after the border skirmish.", c: ["deteriorate", "flourish", "consolidate", "reconcile"], a: 0, exp: "Deteriorate แปลว่า เสื่อมโทรมลง แย่ลงอย่างต่อเนื่อง" },
            { q: "The CEO’s speech was highly _________, leaving the board members confused about the future direction of the firm.", c: ["ambiguous", "articulate", "persuasive", "transparent"], a: 0, exp: "Ambiguous แปลว่า คลุมเครือ กำกวม ส่งผลให้คณะกรรมการเกิดความสับสน" },
            { q: "The new ecological law serves to mitigate the _________ effects of industrial waste on the marine ecosystem.", c: ["deleterious", "salubrious", "innocuous", "negligible"], a: 0, exp: "Deleterious แปลว่า อันตรายร้ายแรงส่งผลเสียมาก" },
            { q: "The pristine rain forest, _________ by human intervention for centuries, is now facing critical threats from logging.", c: ["unmarred", "demolished", "exploited", "transformed"], a: 0, exp: "Unmarred แปลว่า ไม่ถูกทำลาย/คงสภาพสมบูรณ์ดั้งเดิม สอดคล้องกับป่าบริสุทธิ์ (pristine)" },
            { q: "He was vindicated by the court evidence, which _________ proved his innocence beyond a shadow of doubt.", c: ["unequivocally", "erroneously", "superficially", "partially"], a: 0, exp: "Unequivocally แปลว่า อย่างชัดเจนแจ่มแจ้งปราศจากข้อโต้แย้ง" },
            { q: "The candidate's _________ response during the debate cost him the support of the undecided voters.", c: ["evasive", "candid", "insightful", "eloquent"], a: 0, exp: "Evasive แปลว่า บ่ายเบี่ยง ตอบไม่ตรงคำถาม ทำให้เสียคะแนนนิยม" },

            { q: "มิติสัมพันธ์: หากคลี่กล่องลูกบาศก์ออกมาเป็นรูปกากบาท หน้าที่อยู่ตรงข้ามกันจะไม่มีวันติดกัน ข้อใดอธิบายหน้าตรงข้ามของลูกบาศก์ได้ถูกต้องที่สุด?", c: ["หน้าแถวเดียวกันที่อยู่เว้นข้ามกัน 1 ช่อง", "หน้าสองหน้าที่อยู่ติดข้างกันพอดี", "หน้ามุมบนและมุมล่างสุดเสมอ", "ลูกบาศก์คลี่แล้วไม่มีหน้าตรงข้ามคงที่"], a: 0, exp: "ตามหลักมิติสัมพันธ์ เมื่อคลี่กล่องออกเป็นรูปกากบาท หน้าที่อยู่ตรงข้ามกันจะเป็นหน้าในแนวเส้นเดียวกันแต่ถูกเว้นคั่นไว้ 1 ช่องเสมอ" },
