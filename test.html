<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบจำลองข้อสอบ TCAS (GAT / PAT / A-Level)</title>
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --success: #10b981;
            --danger: #ef4444;
            --background: #f3f4f6;
            --card: #ffffff;
            --text: #1f2937;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'ChulaCharasNew', 'Sarabun', sans-serif;
        }

        body {
            background-color: var(--background);
            color: var(--text);
            padding: 20px;
            line-height: 1.6;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            background: var(--card);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        h1, h2, h3 {
            text-align: center;
            margin-bottom: 20px;
            color: var(--primary);
        }

        .btn {
            display: block;
            width: 100%;
            padding: 12px 20px;
            margin: 10px 0;
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            transition: background 0.2s;
            text-align: left;
        }

        .btn:hover {
            background-color: var(--primary-hover);
        }

        .btn-center {
            text-align: center;
        }

        .choice-btn {
            background-color: #f9fafb;
            color: var(--text);
            border: 2px solid #e5e7eb;
        }

        .choice-btn:hover {
            background-color: #f3f4f6;
        }

        .correct {
            background-color: var(--success) !important;
            color: white;
            border-color: var(--success);
        }

        .wrong {
            background-color: var(--danger) !important;
            color: white;
            border-color: var(--danger);
        }

        .hidden {
            display: none;
        }

        .progress-bar {
            width: 100%;
            background-color: #e5e7eb;
            height: 10px;
            border-radius: 5px;
            margin-bottom: 20px;
            overflow: hidden;
        }

        .progress {
            width: 0%;
            height: 100%;
            background-color: var(--success);
            transition: width 0.3s;
        }

        .explanation {
            margin-top: 15px;
            padding: 15px;
            background-color: #eff6ff;
            border-left: 4px solid #3b82f6;
            border-radius: 4px;
        }

        .score-text {
            font-size: 24px;
            text-align: center;
            margin: 20px 0;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="container">
    <div id="category-screen">
        <h1>เลือกประเภทข้อสอบจำลอง</h1>
        <p style="text-align:center; margin-bottom: 20px; color: #6b7280;">ไม่ต้องลงทะเบียน คลิกเลือกเพื่อเริ่มทำได้ทันที</p>
        <button class="btn btn-center" onclick="showSubCategory('gat')">TGAT (GAT)</button>
        <button class="btn btn-center" onclick="showSubCategory('pat')">TPAT (PAT / PAT 1)</button>
        <button class="btn btn-center" onclick="showSubCategory('alevel')">A-Level (7 วิชาหลัก)</button>
    </div>

    <div id="sub-category-screen" class="hidden">
        <h2 id="sub-title">เลือกพาร์ทข้อสอบ</h2>
        <div id="sub-options"></div>
        <button class="btn btn-center choice-btn" onclick="goBack('category-screen')">⬅️ ย้อนกลับหน้าหลัก</button>
    </div>

    <div id="quiz-screen" class="hidden">
        <div style="display: flex; justify-content: space-between; margin-bottom: 10px;">
            <span id="quiz-info-title">ข้อสอบ</span>
            <span id="question-number">ข้อที่ 1/60</span>
        </div>
        <div class="progress-bar"><div id="progress" class="progress"></div></div>
        
        <h3 id="question-text" style="text-align: left; color: var(--text);">โจทย์กำลังโหลด...</h3>
        
        <div id="choices-container"></div>
        
        <div id="explanation-container" class="explanation hidden">
            <strong>💡 เฉลยละเอียด:</strong> <span id="explanation-text"></span>
        </div>
        
        <button id="next-btn" class="btn btn-center hidden" onclick="nextQuestion()">ข้อถัดไป ➡️</button>
    </div>

    <div id="result-screen" class="hidden">
        <h2>สรุปผลคะแนน</h2>
        <div class="score-text" id="final-score">0 / 0 คะแนน</div>
        <p id="evaluation-text" style="text-align: center; margin-bottom: 20px; font-weight: bold;"></p>
        <button class="btn btn-center" onclick="restartQuiz()">🔄 ทำใหม่อีกครั้ง (ระบบจะสุ่มโจทย์ใหม่)</button>
        <button class="btn btn-center choice-btn" onclick="goBack('category-screen')">🏠 กลับหน้าหลัก</button>
    </div>
</div>

<script>
// คลังข้อสอบสำหรับทุกพาร์ทและทุกวิชา (สามารถก๊อปวางเพิ่มโจทย์ให้ครบพาร์ทละ 60 ข้อได้เลยนะจ๊ะ)
const quizData = {
    gat_eng: [
        { q: "Choose the best answer: If I _______ wings, I would fly to school.", c: ["have", "had", "have had", "having"], a: 1, exp: "เป็นโครงสร้าง Conditional Sentence Type 2 (Unreal Present) ใช้คู่กับ Verb ช่อง 2 (had)" },
        { q: "Which word has the closest meaning to 'Generous'?", c: ["Selfish", "Kind / Giving", "Greedy", "Cruel"], a: 1, exp: "Generous แปลว่า ใจกว้าง โอบอ้อมอารี ตรงกับคำว่า Kind / Giving" }
    ],
    gat_reasoning: [
        { q: "ถ้า 'นกทุกตัวบินได้' และ 'เพนกวินเป็นนก' ข้อใดสรุปได้ถูกต้องที่สุด?", c: ["เพนกวินบินได้ตามหลักตรรกศาสตร์", "เพนกวินบินไม่ได้ในความเป็นจริง", "สรุปไม่ได้", "นกบางตัวบินไม่ได้"], a: 0, exp: "ตามหลักตรรกศาสตร์ถ้านกทุกตัวบินได้ และเพนกวินเป็นนก เพนกวินก็ต้องบินได้" }
    ],
    gat_work: [
        { q: "หากคุณพบว่าเพื่อนร่วมงานโกงเงินบริษัท คุณจะทำอย่างไรเป็นสิ่งแรก?", c: ["ไปบอกพนักงานคนอื่น", "โพสต์ลงโซเชียลมีเดีย", "รวบรวมหลักฐานและรายงานหัวหน้า", "แกล้งทำเป็นไม่รู้ไม่เห็น"], a: 2, exp: "การแก้ปัญหาอย่างเป็นมืออาชีพและถูกต้องตามสมรรถนะการทำงานคือรวบรวมหลักฐานและแจ้งผู้มีอำนาจตรวจสอบตามขั้นตอน" }
    ],
    pat_1: [
        { q: "PAT 1: กำหนดให้เซต A มีสมาชิก 3 ตัว จำนวนสับเซตทั้งหมดของเซต A เท่ากับเท่าใด?", c: ["3", "6", "8", "9"], a: 2, exp: "สูตรจำนวนสับเซตคือ 2^n ดังนั้น 2^3 = 8 สับเซต" }
    ],
    pat_engineering: [
        { q: "หน่วยของความต้านทานไฟฟ้าคืออะไร?", c: ["โวลต์", "แอมแปร์", "โอห์ม", "วัตต์"], a: 2, exp: "ความต้านทานไฟฟ้ามีหน่วยเป็น โอห์ม (Ω)" }
    ],
    alevel_physics: [
        { q: "A-Level ฟิสิกส์: วัตถุเคลื่อนที่ด้วยความเร็วคงที่ แรงลัพธ์ที่กระทำต่อวัตถุมีค่าเท่าใด?", c: ["มีค่ามากกว่าศูนย์", "มีค่าน้อยกว่าศูนย์", "มีค่าเท่ากับศูนย์", "บอกไม่ได้"], a: 2, exp: "ตามกฎข้อที่ 1 ของนิวตัน ถ้ายืนยันว่าความเร็วคงที่ (ความเร่งเป็นศูนย์) แรงลัพธ์ (ΣF) จะต้องเท่ากับศูนย์" }
    ],
    alevel_chemistry: [
        { q: "A-Level เคมี: สารในข้อใดมีสมบัติเป็นเบส?", c: ["HCl", "NaOH", "H2SO4", "NaCl"], a: 1, exp: "NaOH (โซเดียมไฮดรอกไซด์) ละลายน้ำแล้วให้ไฮดรอกไซด์ไอออน มีสมบัติเป็นเบส" }
    ],
    alevel_biology: [
        { q: "A-Level ชีววิทยา: ออร์แกเนลล์ใดทำหน้าที่ผลิตพลังงาน (ATP) ให้แก่เซลล์?", c: ["ไรโบโซม", "ไมโทคอนเดรีย", "ไลโซโซม", "คลอโรพลาสต์"], a: 1, exp: "ไมโทคอนเดรีย (Mitochondria) เปรียบเสมือนโรงไฟฟ้าของเซลล์ ทำหน้าที่สร้างพลังงาน ATP" }
    ],
    alevel_math_basic:
